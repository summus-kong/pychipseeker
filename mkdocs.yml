site_name: pychipseeker
site_description: ChIPseeker-compatible peak annotation, analysis and publication-ready figures in Python.
site_url: https://summus-kong.github.io/pychipseeker/
repo_url: https://github.com/summus-kong/pychipseeker
repo_name: summus-kong/pychipseeker
edit_uri: edit/main/docs/
copyright: MIT licensed · built with MkDocs Material

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

nav:
  - Home: index.md
  - Get started:
      - Installation: installation.md
      - Quick start: quickstart.md
  - Guides:
      - Figure gallery: gallery.md
      - Analysis recipes: analysis.md
      - Genomes and TxDb: genomes.md
      - Enrichment: enrichment.md
      - Performance: performance.md
  - Reference:
      - Command line: cli.md
      - API overview: api.md
      - FAQ and troubleshooting: faq.md
  - Project:
      - Changelog: https://github.com/summus-kong/pychipseeker/blob/main/CHANGELOG.md
      - Parity with ChIPseeker: https://github.com/summus-kong/pychipseeker/blob/main/PARITY.md
      - Contributing: https://github.com/summus-kong/pychipseeker/blob/main/README.md#development

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/summus-kong/pychipseeker
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/pychipseeker/
  generator: false
