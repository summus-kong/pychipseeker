[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pychipseeker"
version = "0.8.3"
description = "A lightweight, ChIPseeker-compatible Python implementation of peak annotation and visualization"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "pychipseeker contributors" }]
keywords = [
    "bioinformatics",
    "ChIP-seq",
    "ATAC-seq",
    "peak annotation",
    "genomics",
    "ChIPseeker",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
# pyBigWig and pysam have no PyPI wheels for every Windows/Python
# combination.  Marking them non-Windows keeps
# `pip install pychipseeker[all]` installable there; Windows users who need
# signal or BAM support can install them via conda-forge/bioconda.
bigwig = ["pyBigWig>=0.3.22; sys_platform != 'win32'"]
bigbed = ["pybigtools>=0.1"]
bam = ["pysam>=0.21; sys_platform != 'win32'"]
enrich = ["gseapy>=1.1"]
all = [
    "pyBigWig>=0.3.22; sys_platform != 'win32'",
    "pybigtools>=0.1",
    "pysam>=0.21; sys_platform != 'win32'",
    "gseapy>=1.1",
]
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/summus-kong/pychipseeker"
Documentation = "https://github.com/summus-kong/pychipseeker/tree/main/docs"
Source = "https://github.com/summus-kong/pychipseeker"
Issues = "https://github.com/summus-kong/pychipseeker/issues"
Changelog = "https://github.com/summus-kong/pychipseeker/blob/main/CHANGELOG.md"
"Genome data" = "https://github.com/summus-kong/pychipseeker/releases/tag/genome-data-2026.10"

[project.scripts]
pychipseeker = "pychipseeker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pychipseeker = [
    "py.typed",
    "data/*.csv.gz",
    "data/*.json",
    "data/*.bw",
    "data/GEO_sample_data/*.gz",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py39"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "examples/output",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501", # long comments/docstrings are kept readable in source
    "B008", # argparse defaults and pandas idioms
    "UP006", # keep typing.Dict/List for Python 3.9 compatibility
    "UP007", # X | Y annotations are not enforced for Python 3.9
    "UP035",
    "UP037",
    "UP045",
    "UP031",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"examples/*" = ["E402", "F401"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = false
check_untyped_defs = false
files = [
    "src/pychipseeker/enrichment.py",
    "src/pychipseeker/genomes.py",
    "src/pychipseeker/io.py",
    "src/pychipseeker/peaks.py",
    "src/pychipseeker/report.py",
]
exclude = ["examples/output", "build", "dist"]

[tool.coverage.run]
source = ["pychipseeker"]
omit = ["src/pychipseeker/data/*"]
