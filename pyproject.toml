[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pychipseeker"
version = "0.3.0"
description = "A lightweight, ChIPseeker-compatible Python implementation of peak annotation and visualization"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "pychipseeker contributors" }]
keywords = [
    "bioinformatics",
    "ChIP-seq",
    "ATAC-seq",
    "peak annotation",
    "genomics",
    "ChIPseeker",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "matplotlib>=3.6",
    "pyBigWig>=0.3.22",
]

[project.optional-dependencies]
enrich = ["gseapy>=1.1"]
dev = ["pytest>=7", "pytest-cov"]

[project.scripts]
pychipseeker = "pychipseeker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pychipseeker = [
    "data/*.csv.gz",
    "data/GEO_sample_data/*.gz",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
