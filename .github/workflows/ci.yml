name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        exclude:
          # py3.9 is unavailable on the current ubuntu-latest image.
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-22.04
            python: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Install pyBigWig (optional)
        # pyBigWig has no Windows wheels for every Python version.  This step
        # always succeeds; bigWig-specific tests skip when the import fails.
        shell: python
        run: |
          import subprocess, sys
          result = subprocess.run(
              [sys.executable, "-m", "pip", "install", "pyBigWig>=0.3.22"],
              check=False,
          )
          if result.returncode:
              print(
                  "::warning::pyBigWig is unavailable; "
                  "bigWig-specific tests will be skipped"
              )
      - name: Install pysam (optional)
        # pysam has no Windows wheels for every Python version either.  The
        # real-BAM regression tests skip when the import fails.
        shell: python
        run: |
          import subprocess, sys
          result = subprocess.run(
              [sys.executable, "-m", "pip", "install", "pysam>=0.21"],
              check=False,
          )
          if result.returncode:
              print(
                  "::warning::pysam is unavailable; "
                  "BAM-specific tests will be skipped"
              )
      - name: Ruff
        run: python -m ruff check src tests examples scripts
      - name: Pytest
        run: python -m pytest -q
      - name: Coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: >-
          python -m pytest -q
          --cov=pychipseeker
          --cov-report=term-missing
          --cov-fail-under=75

  typing:
    name: typing (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Mypy
        run: python -m mypy

  reference:
    name: function reference (drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Regenerate function reference
        run: python scripts/build_function_reference.py
      - name: Check generated page is committed
        run: git diff --exit-code docs/reference/functions.md

  core:
    name: core-only (no optional extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Pytest without optional dependencies
        run: python -m pytest -q

  wheel:
    name: wheel install (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build
        run: python -m pip install --upgrade pip build && python -m build --wheel
      - name: Install core wheel
        run: |
          $wheel = Get-ChildItem dist/*.whl | Select-Object -First 1
          python -m pip install --force-reinstall $wheel.FullName
      - name: Smoke test
        run: python -c "import pychipseeker as pcs; print(pcs.__version__)"
